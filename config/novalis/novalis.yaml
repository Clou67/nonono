name: Ratchet & Clank (USA) - Novalis overlay (level 1)
sha1: 1e937db0ca46a36720ef4c7d542e2cc0fef69f42

# Level overlay for Novalis, as unpacked by Wrench:
#   rac_scus_971_99/levels/1_novalis/overlay.elf  ->  assets/levels/1_novalis/overlay.elf
# It is loaded over the boot ELF's level region (0x15EF00..), so vram = file offset + 0x15DF00
# for every section. The resident core (0x100080..0x15EEDF) is not part of this file; its
# symbols come from config/novalis/core_symbols.txt.
#
# File split: one subsegment per original source file, in link order. Boundaries come from
# the labeled Ghidra project (namespace = source file). The moby/camera/sound update code at
# the end is one file per class (game/update/moby<oClass>, camera<N>, sound<N>); helper
# functions before an UpdateMoby_<N> belong to that file.

options:
  basename: novalis
  target_path: assets/levels/1_novalis/overlay.elf
  elf_path: build/novalis/overlay.elf
  base_path: ../../
  platform: ps2
  compiler: EEGCC

  asm_path: code/_generated/novalis
  src_path: code/novalis
  data_path: code/_generated/novalis/data
  build_path: build/novalis
  ld_script_path: build/novalis/novalis.ld
  o_as_suffix: True

  find_file_boundaries: False
  disasm_unknown: True
  named_regs_for_c_funcs: False

  pair_rodata_to_text: False
  rodata_string_guesser_level: 0

  generate_asm_macros_files: False

  create_undefined_funcs_auto: True
  undefined_funcs_auto_path: build/novalis/undefined_funcs_auto.txt
  create_undefined_syms_auto: True
  undefined_syms_auto_path: build/novalis/undefined_syms_auto.txt
  symbol_addrs_path:
    - config/novalis/symbols.txt
    - config/novalis/core_symbols.txt

  ld_legacy_generation: True
  # Sections are packed back to back in the original; no extra ALIGN(16) between them.
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  check_consecutive_segment_types: False
  subalign: 8

segments:
  - [0, databin, elf_header]

  # Small data (.lit holds the overlay's .sdata/.lit4). Matched files' .sdata is
  # carved out at its original address.
  - name: lit
    type: code
    start: 0x1000
    vram: 0x0015ef00
    subalign: 4
    align: 4
    subsegments:
    - [0x1000, lit4]
    - [0x13f0, .sdata, game/draw]  # draw state and DefaultDraw timer labels
    - [0x1568, lit4]
    - [0x15a8, .sdata, game/freeze]  # layout values, format strings
    - [0x1668, lit4]
    - [0x1750, .sdata, game/galaxymap]  # MediumFontHeight
    - [0x1754, lit4]
    - [0x1778, .sdata, game/hero]  # hero timers and tables, slide anim frames, pack jump velocity keys
    - [0x17f8, lit4]
    - [0x1d00, .sdata, game/loaders]  # ship texture defs, hud bank labels, occlusion chars, byte grid
    - [0x1db0, .sdata, game/main]  # ClearMem warning, system misc timer label
    - [0x1dc8, lit4]
    - [0x2028, .sdata, game/memcard]  # g_loaderr, entry path and delete formats
    - [0x2050, lit4]
    - [0x2080, .sdata, game/mobyfunc]  # timer labels, moby lists and markers, env samples
    - [0x2180, lit4]
    - [0x2220, .sdata, game/music]  # cdrom device, stop warning
    - [0x2230, .sdata, game/npc]  # BoltHudHandle, separators, price format
    - [0x2260, lit4]
    - [0x2340, .sdata, game/partupd]  # PartFadeAlphaStep
    - [0x2344, lit4]
    - [0x2570, .sdata, game/shrubfunc]  # shrub texs, shrub draw labels
    - [0x2590, lit4]
    - [0x25c8, .sdata, game/skyfunc]  # scratchpad DMA buffers and index, unused packet data, sky texture label; trailing zero fill includes Sky at 0x16051c
    - [0x2620, lit4]
    - [0x3030, .sdata, game/tfragfunc]  # tfrag texs, tfrag draw labels
    - [0x3050, lit4]
    - [0x30a0, .sdata, game/tiefunc]  # tie texs, tie draw labels
    - [0x30c0, lit4]
    - [0x3228, .sdata, game/vendor]  # timer labels, bolt formats, arrows, dude state
    - [0x32a0, .sdata, game/vuchain]  # VifChainFlags
    - [0x32a4, lit4]
    - [0x3438, .sdata, movie/movie]  # movie error format, decoder state
    - [0x3458, .sdata, movie/videodec]  # sequence end code, error format
    - [0x3468, lit4]

  # .bss is NOBITS in the section table but the single PT_LOAD covers it with zeros.
  - name: bss
    type: data
    pair_segment: text
    start: 0x4380
    vram: 0x00162280

  # Matched files' string literals (.rodata) are carved out at their original address.
  - name: data
    type: code
    start: 0x8580
    vram: 0x00166480
    align: 4
    subsegments:
    - [0x8580, data]
    - [0x1b990, .data, game/help]  # Help, HelpPairs, not_found
    - [0x1bc50, data]
    - [0xaa970, .rodata, game/actuator]  # jump table
    - [0xaa990, data]
    - [0xaab60, .rodata, game/draw]  # long DefaultDraw timer labels
    - [0xaab90, .rodata, game/freeze]  # jump tables
    - [0xaace0, .rodata, game/help]  # jump tables
    - [0xaad50, .rodata, game/hero]  # gadget helper tables and the Hero_DoBehavior, Hero_InitBodyState, Hero_GadgetTransitions and Hero_Transitions jump tables
    - [0xab670, data]
    - [0xab730, .rodata, game/lights]  # debug strings
    - [0xab7a0, .rodata, game/loaders]  # moby memory and occlusion messages, LoadLevelFiles jump table
    - [0xabc30, .rodata, game/main]  # mode switch jump table
    - [0xabc60, data]
    - [0xabde0, .rodata, game/memcard]
    - [0xabfa0, data]
    - [0xabfd0, .rodata, game/mobyfunc]  # create failure, chain overflow, env sample messages
    - [0xac060, data]
    - [0xac280, .rodata, game/npc]  # separators, jump table
    - [0xac2c0, data]
    - [0xac4d0, .rodata, game/shrubfunc]  # texture overflow message
    - [0xac4e8, data]
    - [0xac5b0, .rodata, game/tfragfunc]  # texture overflow message
    - [0xac5c8, .rodata, game/tiefunc]  # texture overflow message
    - [0xac5e0, data]
    - [0xac690, .rodata, game/vuchain]
    - [0xac718, data]
    - [0xac860, .rodata, movie/movie]  # open error
    - [0xac878, .rodata, movie/read]  # pts overflow message
    - [0xac890, .rodata, movie/vibuf]  # inactive DMA message
    - [0xac8a8, .rodata, movie/videodec]  # decode error messages
    - [0xac8e8, data]

  - name: lvl.vtbl
    type: code
    align: 0x80
    start: 0xadc00
    vram: 0x0020bb00
    subsegments:
    - [0xadc00, .rodata, game/vtbl/mobyvtbl]

  - name: lvl.camvtbl
    type: code
    align: 0x80
    start: 0xae580
    vram: 0x0020c480
    subsegments:
    - [0xae580, .rodata, game/vtbl/camvtbl]

  - name: lvl.sndvtbl
    type: code
    align: 0x80
    start: 0xae680
    vram: 0x0020c580
    subsegments:
    - [0xae680, .rodata, game/vtbl/sndvtbl]

  - name: text
    type: code
    start: 0xae700
    vram: 0x0020c600
    subalign: 4
    align: 4
    subsegments:
    - [0xae700, cpp, game/actuator]
